<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Tanish</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            overflow:hidden;
        }

        .container{
            text-align:center;
            padding:40px;
            max-width:600px;
        }

        .check{
            font-size:90px;
            color:#22c55e;
            animation:pop .5s ease;
        }

        h1{
            margin-top:20px;
            font-size:42px;
        }

        p{
            margin-top:15px;
            color:#94a3b8;
            line-height:1.8;
            font-size:18px;
        }

        .btn{
            display:inline-block;
            margin-top:35px;
            padding:14px 35px;
            background:#38bdf8;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:600;
            transition:.3s;
        }

        .btn:hover{
            background:#0ea5e9;
            transform:translateY(-3px);
        }

        @keyframes pop{

            0%{
                transform:scale(0);
            }

            100%{
                transform:scale(1);
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="check">✅</div>

        <h1>Message Sent!</h1>

        <p>
            Thank you for reaching out.<br>
            I have received your message and will get back to you as soon as possible.
        </p>

        <a href="index.html" class="btn">← Back to Portfolio</a>

    </div>

</body>
</html>
